#
# OpenHarmony kernel hunt target — **master branch** (latest), PREBUILT agent
# image.
#
# HUNT MODE. Unlike the CVE-validation targets, this has NO pre-planted known
# bug. The find agent reads the attack_surface, crafts PoCs, boots the OHOS
# kernel in QEMU/KVM, and submits whatever real kernel crash it can land.
# grade_reference is deliberately class-agnostic (any KASAN report / kernel
# oops / panic with a kernel Call Trace in scope).
#
# Why master (vs targets/ohos6-kernel which pins OpenHarmony-6.0-Release)?
# The 6.0-Release branch is a 2025-08-12 snapshot that lags master by 19
# commits and is missing the CVE-2025-38588 family fixes — hunting it mostly
# surfaces known, already-fixed-upstream bugs. Master (2025-09-09,
# f88704ae607f) carries the latest CVE backports, so a bug found here is far
# more likely to be real and not-yet-fixed.
#
# Kernel verified (2026-08-15, git ls-remote): openharmony/kernel_linux_5.10 @
# master = Linux 5.10.210; gitee commit f88704ae607f90518f67aee33790ac06d6ada77d.
# The image's bzImage is built by targets/ohos6-kernel-master/build_kernel.sh
# (KASAN + SOFTLOCKUP_DETECTOR + BOOTPARAM_SOFTLOCKUP_PANIC enabled on top of
# the official qemu-x86_64-linux_standard_defconfig).
image_tag: vuln-pipeline-ohos6-kernel-master:latest

github_url: https://gitee.com/openharmony/kernel_linux_5.10
commit: "master @ f88704ae607f90518f67aee33790ac06d6ada77d (2025-09-09, Linux 5.10.210)"

# No single binary — the agent boots the kernel itself. Placeholder.
binary_path: /bin/true
source_root: /src/linux

detector: kasan
devices:
  - /dev/kvm
agent_prebuilt: true
# Agent container must reach the model API; in this environment that is only
# possible through the host-loopback proxy, so use host networking.
agent_network: host
memory_limit: 8g

attack_surface: |
  OpenHarmony common-kernel **master branch** (openharmony/kernel_linux_5.10
  @ f88704ae607f, Linux 5.10.210 + OpenHarmony CVE backports and features;
  HDF hardware-driver framework applied separately via
  openharmony/kernel_linux_patches — NOT included in this image). This is the
  LATEST tree: it already carries the recent CVE backports (e.g.
  CVE-2025-38588 rt6_nlmsg_size infinite-loop fix, fib6 RCU follow-ups), so
  hunting it targets bugs that are still OPEN upstream/OHOS — not known CVE
  regressions. Hunt scope: any memory-safety or logic bug reachable from
  unprivileged userspace via syscalls, ioctls, netlink, keyrings, AF_ALG, or
  driver entry points.

  Environment note: THIS image's kernel is built with KASAN enabled
  (CONFIG_KASAN=y, generic inline), UBSAN enabled (undefined-behavior checks:
  signed overflow, shift, array-bounds, div-by-zero), plus SOFTLOCKUP_DETECTOR /
  BOOTPARAM_SOFTLOCKUP_PANIC / PANIC_ON_OOPS. Memory-safety crashes surface as
  `BUG: KASAN: ...` reports; undefined-behavior bugs surface as `UBSAN:` reports
  (or a `kernel BUG at lib/ubsan.c`); other bugs surface as a kernel oops
  (`BUG: kernel ...` / `RIP:` / `Kernel panic`) with a kernel Call Trace;
  CPU spins and oops both escalate to a panic. Judge on the report / oops and
  the kernel call chain, not on any single function.

  Source layout: the OpenHarmony tree is at /src/linux (source_root); the
  pristine upstream Linux 5.10.210 source is pre-baked at /src/upstream for
  diffing — use it to isolate the OHOS-customized/backported surface; do NOT
  download upstream, it is already there.

  ## Description of the vulnerability

  (Hunt mode — no pre-planted claim.) Treat the OpenHarmony master tree as
  hostile: inspect the OHOS-customized and backported code paths for classic
  kernel bugs — OOB access, use-after-free, integer overflow, unchecked
  copy_from_user sizes, missing bounds/refcount checks. Prefer attack surface
  that differs from upstream 5.10 (OHOS features, backports, custom drivers)
  since pristine upstream paths are already well fuzzed. The most valuable
  finds are bugs NOT yet fixed upstream or in OHOS master — check upstream
  fix history before spending turns polishing a reproduction of a known CVE.

grade_reference: |
  Expected observable crash in THIS image (OpenHarmony master 5.10.210 kernel,
  KASAN + UBSAN enabled, booted in QEMU/KVM). In-scope kernel crash shapes:

  - KASAN report: `BUG: KASAN: <class> in <func>` with a kernel Call Trace
  - UBSAN report: `UBSAN: <class> in <func>` (undefined behavior — signed
    overflow, shift, out-of-bounds, div-by-zero) with a kernel Call Trace
  - Kernel oops: `BUG: kernel NULL pointer dereference` / `general protection
    fault` / `BUG: unable to handle page fault ...` with `RIP: 0010:<func>`
    and a kernel Call Trace
  - Kernel panic with a kernel Call Trace

  Root-cause match: the crash must be a KERNEL bug — the top frames of the
  KASAN report / oops Call Trace must name a kernel function, and the claimed
  root cause must be consistent with the observed class and top frame. A
  userspace-only crash of the reproducer is a PoC bug and FAILS. Each
  submission must reproduce 3/3 on fresh boots, and the root-cause narrative
  must explain how the userspace input drives the kernel down that path.

focus_areas:
  - "OHOS master tree (5.10.210 @ f88704ae607f): any reachable kernel memory-safety bug (KASAN/oops/panic) in the OpenHarmony-customized or backported surface — prefer bugs not yet fixed upstream"

known_bugs: []
