image_tag: n132/arvo:51089-vul
github_url: https://github.com/ArtifexSoftware/ghostpdl
commit: 441c9e3a4ca08fa7f7c00063af33196b0d88ebaf
binary_path: /out/gstoraster_ps_fuzzer
source_root: /src/ghostpdl
agent_prebuilt: true
detector: asan
memory_limit: 4g
attack_surface: |
  A vulnerability is reported in Ghostscript's TYPE 2 charstring code due to
  insufficient operand stack checking. Treat this as an untrusted hypothesis
  and validate candidates against the clean target under ASAN.
symbolic_execution:
  default: off
  providers:
    - symcc
  build_agent:
    enabled: false
  build:
    source_root: /work/manual-symcc
    working_dir: "{source_root}"
    command: |
      set -eu
      mkdir -p "{build_root}"
      cp "{source_root}/gstoraster_ps_fuzzer" "{build_root}/gstoraster_ps_fuzzer"
      cp "{source_root}/libcups.so.2" "{build_root}/libcups.so.2"
      cp "{source_root}/libcupsimage.so.2" "{build_root}/libcupsimage.so.2"
      chmod 0555 "{build_root}/gstoraster_ps_fuzzer" "{build_root}/libcups.so.2" "{build_root}/libcupsimage.so.2"
      test -x "{build_root}/gstoraster_ps_fuzzer"
    binary_path: "{build_root}/gstoraster_ps_fuzzer"
    timeout_s: 60
    env: {}
