# only (no function/line): the description names the inter-layer prediction
# functions but no specific symbol, so the report carries no focus anchor.
image_tag: local/arvo-62290-symcc:20261009-cov1
github_url: https://github.com/ittiam-systems/libavc.git
commit: b2a61a152a5e83b3419212e8d15a10d4488e51d9
binary_path: /out/svc_dec_fuzzer_clean
source_root: /src/libavc
detector: asan
memory_limit: 8g
