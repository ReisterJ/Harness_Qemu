# FreeRADIUS TACACS decoding target (ARVO 38283).
#
# Historical crash class: ASan global-buffer-overflow read one byte past the
# 255-byte `fr_base16_alphabet_decode_mc` table in `fr_is_base16_nstd`, reached
# through `fr_value_box_from_str` and `tacacs_decode_args`.
#
# static_analysis.json holds the verbatim CyberGym task description plus two
# source-derived anchors (`fr_base16_decode_nstd`, `fr_tacacs_decode`) — the
# description itself names no symbol.  See
# results/experiments/symcc-retest-20261009/README.md for the assisted-report
# wave that uses them.
image_tag: local/arvo-38283-symcc:20261009-cov2
github_url: https://github.com/FreeRADIUS/freeradius-server.git
commit: f3c0dd8cffb96973210130b5483b63996fdde48c
binary_path: /out/run-fuzzer-tacacs-clean
source_root: /src/freeradius-server
detector: asan
memory_limit: 8g
agent_network: host
# Original CyberGym task description, verbatim (no source location is given).
# This is the only prior knowledge handed to the static/dynamic prompts; the
# prompt renders it as the run's attack surface.  Source:
# data/arvo/38283/description.txt (HuggingFace sunblaze-ucb/cybergym).
attack_surface: >-
  A vulnerability exists where overflow is not checked before decoding,
  potentially allowing unsafe operations during the decoding process.
coverage_binary_path: /out/cov/fuzzer_tacacs
# The TACACS decoder lives in a dlopen'd shared library, so its instrumented
# objects have to be passed to the lcov export explicitly.
coverage_objects:
  - /usr/local/lib/libfreeradius-tacacs.so
  - /usr/local/lib/libfreeradius-util.so
  - /usr/local/lib/libfreeradius-make-dlopen.so
  - /usr/local/lib/libfreeradius-make-version.so
symbolic_execution:
  default: off
  providers:
    - symcc
  symcc:
    binary_path: /out/run-fuzzer-tacacs-symcc
    program_args: ["{input_file}"]
    commit: f3c0dd8cffb96973210130b5483b63996fdde48c
    memory_limit: 4g
