#
# OpenHarmony 6.0 standard-system kernel hunt target — PREBUILT agent image.
#
# HUNT MODE: unlike the CVE-validation targets (kernelval, syzbot-buildid,
# tls-uaf), this target has NO pre-planted known bug. The find agent reads the
# attack_surface (the OpenHarmony common-kernel baseline), crafts PoCs, boots
# the OHOS kernel in QEMU/KVM, and submits whatever real kernel crash it can
# land. grade_reference is deliberately class-agnostic (any KASAN report /
# kernel oops / panic with a kernel Call Trace in scope) — narrow it down to a
# specific signature once a concrete subsystem/CVE is being validated.
#
# Kernel verified (2026-08-11): oharmony/kernel_linux_5.10 @
# OpenHarmony-6.0-Release = Linux 5.10.210; gitee commit
# 0461994cd06aa4d37199d4a6e5d58abab642a4ee. The image's bzImage is built by
# targets/ohos6-kernel/build_kernel.sh (KASAN enabled on top of the official
# qemu-x86_64-linux_standard_defconfig). The Dockerfile swaps the syzbot base
# image's /kernel/bzImage and COPYs the OHOS source to /src/linux.
image_tag: vuln-pipeline-ohos6-kernel:latest

github_url: https://gitee.com/openharmony/kernel_linux_5.10
commit: "OpenHarmony-6.0-Release @ 0461994cd06aa4d37199d4a6e5d58abab642a4ee (Linux 5.10.210)"

# No single binary — the agent boots the kernel itself. Placeholder.
binary_path: /bin/true
source_root: /src/linux

detector: kasan
devices:
  - /dev/kvm
agent_prebuilt: true
# Agent container must reach the model API; in this environment that is only
# possible through the host-loopback proxy, so use host networking.
agent_network: host
memory_limit: 8g

attack_surface: |
  OpenHarmony 6.0 standard-system Linux kernel (openharmony/kernel_linux_5.10,
  Linux 5.10.210 + OpenHarmony common-kernel baseline: CVE backports and
  OpenHarmony features; HDF hardware-driver framework and board drivers are
  applied separately via openharmony/kernel_linux_patches — included in this
  image only if the image was built with APPLY_OHOS_PATCHES=1). Hunt scope:
  any memory-safety or logic bug in this kernel reachable from unprivileged
  userspace via syscalls, ioctls, netlink, keyrings, AF_ALG, or driver entry
  points.

  Environment note: THIS image's kernel is built with KASAN enabled
  (CONFIG_KASAN=y, generic inline) — memory-safety crashes surface as
  `BUG: KASAN: ...` reports; other bugs surface as a kernel oops (`BUG: kernel
  ...` / `RIP:` / `Kernel panic`) with a kernel Call Trace. Judge on the KASAN
  report / oops and the kernel call chain, not on any single function.

  Source layout: the OpenHarmony tree is at /src/linux (source_root); the
  pristine upstream Linux 5.10.210 source is pre-baked at /src/upstream for
  diffing — use it to isolate the OHOS-customized surface; do NOT download
  upstream, it is already there.

  ## Description of the vulnerability

  (Hunt mode — no pre-planted claim.) Treat the OpenHarmony common kernel
  baseline as hostile: inspect the OHOS-customized and backported code paths
  for classic kernel bugs — OOB access, use-after-free, integer overflow,
  unchecked copy_from_user sizes, missing bounds/refcount checks. Prefer
  attack surface that differs from upstream 5.10 (OHOS features, HDF if
  present, 5.10.210 backports) since upstream paths are already well fuzzed.

grade_reference: |
  Expected observable crash in THIS image (OpenHarmony 5.10.210 kernel, KASAN
  enabled, booted in QEMU/KVM). In-scope kernel crash shapes:

  - KASAN report: `BUG: KASAN: <class> in <func>` with a kernel Call Trace
  - Kernel oops: `BUG: kernel NULL pointer dereference` / `general protection
    fault` / `BUG: unable to handle page fault ...` with `RIP: 0010:<func>`
    and a kernel Call Trace
  - Kernel panic with a kernel Call Trace

  Root-cause match: the crash must be a KERNEL bug — the top frames of the
  KASAN report / oops Call Trace must name a kernel function, and the claimed
  root cause must be consistent with the observed class and top frame. A
  userspace-only crash of the reproducer is a PoC bug and FAILS. Each
  submission must reproduce 3/3 on fresh boots, and the root-cause narrative
  must explain how the userspace input drives the kernel down that path.

focus_areas:
  - "OHOS common kernel baseline (5.10.210) claim #1: any reachable kernel memory-safety bug (KASAN/oops/panic) in the OpenHarmony-customized or backported surface"

known_bugs: []
